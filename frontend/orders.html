<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders - Starlight Blooms</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/tables.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <h1>🌸 Starlight Blooms</h1>
            </div>
            <div class="nav-menu">
                <a href="index.html" class="nav-link">Dashboard</a>
                <a href="orders.html" class="nav-link active">Orders</a>
                <a href="bouquets.html" class="nav-link">Bouquets</a>
                <a href="materials.html" class="nav-link">Materials</a>
                <a href="reports.html" class="nav-link">Reports</a>
            </div>
        </div>
    </nav>

    <div class="container">

        <main class="main-content">
            <div class="page-header">
                <h2>Order Management</h2>
                <button class="btn btn-primary" id="addOrderBtn">+ Add Order</button>
            </div>

            <div class="filters">
                <input type="text" id="searchInput" class="search-input" placeholder="Search orders...">
                <select id="statusFilter" class="filter-select">
                    <option value="">All Statuses</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
                <input type="date" id="startDate" class="filter-input" placeholder="Start date">
                <input type="date" id="endDate" class="filter-input" placeholder="End date">
            </div>

            <div class="table-container">
                <table class="data-table" id="ordersTable">
                    <thead>
                        <tr>
                            <th>Order #</th>
                            <th>Customer</th>
                            <th>Bouquet</th>
                            <th>Size</th>
                            <th>Date</th>
                            <th>Total</th>
                            <th>Cost</th>
                            <th>Profit</th>
                            <th>Margin %</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-state-icon">📦</div>
                    <p>No orders found. Create your first order to get started.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Order Modal -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Create New Order</h3>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <form class="form" id="orderForm">
                <div class="form-group">
                    <label for="bouquetSelect">Select Bouquet *</label>
                    <select id="bouquetSelect" name="bouquetSelect">
                        <option value="">Select bouquet</option>
                    </select>
                    <small style="color: var(--text-secondary);">Selecting a bouquet will auto-fill the details below</small>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="customerName">Customer Name *</label>
                        <input type="text" id="customerName" name="customerName" required>
                    </div>
                    <div class="form-group">
                        <label for="bouquetType">Bouquet Type *</label>
                        <input type="text" id="bouquetType" name="bouquetType" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="size">Size *</label>
                        <select id="size" name="size" required>
                            <option value="">Select size</option>
                            <option value="small">Small</option>
                            <option value="medium">Medium</option>
                            <option value="large">Large</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="date">Date *</label>
                        <input type="date" id="date" name="date" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="deliveryAddress">Delivery Address *</label>
                    <textarea id="deliveryAddress" name="deliveryAddress" rows="2" required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="totalPrice">Total Price (£) *</label>
                        <input type="number" id="totalPrice" name="totalPrice" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="status">Status *</label>
                        <select id="status" name="status" required>
                            <option value="pending">Pending</option>
                            <option value="completed">Completed</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" name="notes" rows="3"></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Order</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/components/toast.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/pages/orders.js"></script>
</body>
</html>
