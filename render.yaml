services:
  - type: web
    name: starlight-blooms-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGODB_URL
        sync: false  # Set manually in Render dashboard
      - key: DATABASE_NAME
        value: starlight_blooms
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        sync: false  # Set manually with your GitHub Pages URL
