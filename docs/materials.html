<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materials - Starlight Blooms</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/tables.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <h1>🌸 Starlight Blooms</h1>
            </div>
            <button class="menu-toggle" aria-label="Toggle menu">☰</button>
            <div class="nav-menu">
                <a href="index.html" class="nav-link">Dashboard</a>
                <a href="orders.html" class="nav-link">Orders</a>
                <a href="bouquets.html" class="nav-link">Bouquets</a>
                <a href="materials.html" class="nav-link active">Materials</a>
                <a href="reports.html" class="nav-link">Reports</a>
                <a href="calculator.html" class="nav-link">Calculator</a>
            </div>
        </div>
    </nav>
    <div class="menu-overlay"></div>

    <div class="container">

        <main class="main-content">
            <div class="page-header">
                <h2>Material Inventory</h2>
                <button class="btn btn-primary" id="addMaterialBtn">+ Add Material</button>
            </div>

            <div class="filters">
                <input type="text" id="searchInput" class="search-input" placeholder="Search materials...">
                <select id="typeFilter" class="filter-select">
                    <option value="">All Types</option>
                    <option value="Flower">Flowers</option>
                    <option value="Hard Material">Hard Materials</option>
                </select>
            </div>

            <div class="table-container">
                <table class="data-table" id="materialsTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Supplier</th>
                            <th>Product #</th>
                            <th>Cost/Unit</th>
                            <th>Unit</th>
                            <th>Stock</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="materialsTableBody">
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-state-icon">📦</div>
                    <p>No materials found. Add your first material to get started.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Material Modal -->
    <div class="modal" id="materialModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Add Material</h3>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <form class="form" id="materialForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Material Name *</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="type">Type *</label>
                        <select id="type" name="type" required>
                            <option value="">Select type</option>
                            <option value="Flower">Flower</option>
                            <option value="Hard Material">Hard Material</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="supplier">Supplier</label>
                        <input type="text" id="supplier" name="supplier">
                    </div>
                    <div class="form-group">
                        <label for="productNumber">Product Number</label>
                        <input type="text" id="productNumber" name="productNumber">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="costPerUnit">Cost per Unit (£) *</label>
                        <input type="number" id="costPerUnit" name="costPerUnit" step="0.00001" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="unit">Unit *</label>
                        <select id="unit" name="unit" required>
                            <option value="">Select unit</option>
                            <option value="stem">Stem</option>
                            <option value="bunch">Bunch</option>
                            <option value="meter">Meter</option>
                            <option value="piece">Piece</option>
                            <option value="roll">Roll</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="currentStock">Current Stock</label>
                        <input type="number" id="currentStock" name="currentStock" min="0" step="0.01" value="0">
                    </div>
                    <div class="form-group">
                        <label for="lowStockThreshold">Low Stock Alert Threshold</label>
                        <input type="number" id="lowStockThreshold" name="lowStockThreshold" min="0" step="0.01" value="10">
                        <small style="color: var(--text-secondary);">Alert when stock falls below this value</small>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Material</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/components/toast.js"></script>
    <script src="js/mobile-nav.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/pages/materials.js"></script>
</body>
</html>
